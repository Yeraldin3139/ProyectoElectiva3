<section class="filter-bar" aria-label="Filtros del catálogo">
  <div class="filter-group">
    <span class="filter-label" id="estilo-label">Estilo</span>
    <p-selectbutton
      [options]="opcionesEstilo"
      optionLabel="label"
      optionValue="id"
      [allowEmpty]="false"
      [ngModel]="filtros().estilo"
      (ngModelChange)="cambiarEstilo($event)"
      ariaLabelledBy="estilo-label"
    />
  </div>

  <div class="filter-group">
    <label class="filter-label" for="tono">Tono</label>
    <p-select
      inputId="tono"
      [options]="opcionesTono"
      optionLabel="label"
      optionValue="id"
      placeholder="Todos los tonos"
      [showClear]="true"
      [ngModel]="filtros().tono"
      (ngModelChange)="cambiarTono($event)"
      styleClass="tone-select"
    />
  </div>

  <div class="filter-extra">
    @if (filtros().texto) {
      <p-chip [label]="'Búsqueda: ' + filtros().texto" [removable]="true" (onRemove)="quitarTexto()" />
    }
    @if (hayFiltros()) {
      <button pButton type="button" icon="pi pi-filter-slash" label="Limpiar" [text]="true" (click)="resetFilters()"></button>
    }
  </div>
</section>
